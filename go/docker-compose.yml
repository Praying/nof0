services:
  postgres:
    image: postgres:16
    container_name: nof0-postgres
    environment:
      POSTGRES_USER: nof0
      POSTGRES_PASSWORD: nof0
      POSTGRES_DB: nof0
    ports:
      # 本机 5432 已被系统 PostgreSQL 占用，宿主机侧改用 5433
      # （容器间仍通过 postgres:5432 访问）
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nof0 -d nof0"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - nof0-network

  redis:
    image: redis:7
    container_name: nof0-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - nof0-network

  # 一次性迁移任务：建表后退出（exit 0），下次 up 会再次执行（migrate 幂等）
  migrate:
    image: migrate/migrate:v4.18.1
    container_name: nof0-migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - postgres://nof0:nof0@postgres:5432/nof0?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - nof0-network

  nof0-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nof0-api
    ports:
      # 显式绑定 0.0.0.0，允许局域网访问
      - "0.0.0.0:8888:8888"
    volumes:
      # etc/nof0.yaml 的 DataPath: ../mcp/data 按进程 CWD（/app）解析为 /mcp/data
      - ../mcp/data:/mcp/data:ro
    # 密钥与本机配置：cp .env.example .env 后按需填写（ZENMUX_API_KEY、HYPERLIQUID_* 等）
    env_file:
      - .env
    environment:
      # nof0.yaml 通过 ${...} 占位符引用这些变量（裸环境变量名不会被 conf.UseEnv 自动映射）。
      # environment 优先级高于 env_file，容器内用 Docker 网络地址覆盖 .env 的 localhost 值。
      # default_query_exec_mode=simple_protocol 见 .env.example 中的说明（pgx 连接池兼容）。
      - Postgres__DataSource=postgres://nof0:nof0@postgres:5432/nof0?sslmode=disable&default_query_exec_mode=simple_protocol
      - Cache__0__Host=redis:6379
      - Cache__0__Pass=
      - Cache__0__Tls=false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nof0-network

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        # 前端 /api/nof1/* 代理路由转发到 compose 内的自建后端
        - NOF1_API_BASE_URL=http://nof0-api:8888/api
        # 关闭「接口暂停」公告层，展示完整竞技场页面
        - NEXT_PUBLIC_SHOW_PAUSE_OVERLAY=0
    container_name: nof0-web
    ports:
      # 显式绑定 0.0.0.0，允许局域网访问
      - "0.0.0.0:3000:3000"
    environment:
      - NOF1_API_BASE_URL=http://nof0-api:8888/api
    depends_on:
      - nof0-api
    restart: unless-stopped
    networks:
      - nof0-network

networks:
  nof0-network:
    driver: bridge

volumes:
  pgdata:
